# 版本目录（version catalog）：集中声明全项目依赖与 Gradle 插件版本。
# 构建脚本通过 libs.<alias> / alias(libs.plugins.<alias>) 引用，禁止在脚本里再写死版本号。
# 参考：https://docs.gradle.org/current/userguide/version_catalogs.html

[versions]
kotlin = "2.4.0"
compose = "1.11.1"
coroutines = "1.10.2"
lark-oapi = "2.7.3"
gson = "2.11.0"
okhttp = "4.12.0"
slf4j = "2.0.17"
logback = "1.5.18"
# 与 kotlin-test-junit5 传递的 junit-bom 平台线保持一致
junit-platform = "1.10.1"
multiplatform-markdown-renderer = "0.43.0"
coil = "3.5.0"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-swing = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-swing", version.ref = "coroutines" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }
lark-oapi = { module = "com.larksuite.oapi:oapi-sdk", version.ref = "lark-oapi" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
compose-components-resources = { module = "org.jetbrains.compose.components:components-resources", version.ref = "compose" }
multiplatform-markdown-renderer-m2 = { module = "com.mikepenz:multiplatform-markdown-renderer-m2", version.ref = "multiplatform-markdown-renderer" }
multiplatform-markdown-renderer-code = { module = "com.mikepenz:multiplatform-markdown-renderer-code", version.ref = "multiplatform-markdown-renderer" }
multiplatform-markdown-renderer-coil3 = { module = "com.mikepenz:multiplatform-markdown-renderer-coil3", version.ref = "multiplatform-markdown-renderer" }
coil-network-okhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version.ref = "coil" }
coil-svg = { module = "io.coil-kt.coil3:coil-svg", version.ref = "coil" }

[bundles]
# 三个 Markdown 渲染器模块总是一起引入
multiplatform-markdown-renderer = [
    "multiplatform-markdown-renderer-m2",
    "multiplatform-markdown-renderer-code",
    "multiplatform-markdown-renderer-coil3",
]

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
